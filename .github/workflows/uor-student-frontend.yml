name: UOR Student Frontend

on:
  push:
    paths:
      - "frontend/**"
      - "docs/design/uor-estudante-identidade-visual.md"
      - ".github/workflows/uor-student-frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "docs/design/uor-estudante-identidade-visual.md"
      - ".github/workflows/uor-student-frontend.yml"
  workflow_dispatch:

concurrency:
  group: uor-student-frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  quality:
    name: Lint, unit, build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and contract tests
        run: npm run test:uor-student

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uor-student-playwright-report
          path: frontend/playwright-report
          retention-days: 7
