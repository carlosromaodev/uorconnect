name: UOR Estudante backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "docs/vision/uor-connect-v2/**"
      - ".github/workflows/uor-student-backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docs/vision/uor-connect-v2/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: uor
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: uorconnect_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U uor -d uorconnect_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://uor:test-only@localhost:5432/uorconnect_test
      JWT_SECRET: ci-only-uor-student-secret-with-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate:postgres
      - run: npm run prisma:generate:moodle-test
      - run: npx prisma migrate deploy --schema prisma/schema.deploy.prisma
      - run: npm run build
      - run: npm run test:uor-student
      - run: npm run security:scan:uor-student
      - run: npm run pagination:audit:uor-student
      - run: npm run docs:validate:uor-student
      - run: node scripts/uor-student-backup.mjs --help
