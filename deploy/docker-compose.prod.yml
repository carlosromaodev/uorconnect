services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uorconnect}
      POSTGRES_USER: ${POSTGRES_USER:-uorconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      EVOLUTION_POSTGRES_DB: ${EVOLUTION_POSTGRES_DB:-evolution}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uorconnect} -d ${POSTGRES_DB:-uorconnect}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 700m
    cpus: 1.25
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "160mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    mem_limit: 192m
    cpus: 0.35
    networks:
      - internal

  evolution-api:
    image: ${EVOLUTION_IMAGE:-evoapicloud/evolution-api:v2.3.6}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://evolution-api:8080}
      CORS_ORIGIN: ${EVOLUTION_CORS_ORIGIN:-*}
      DEL_INSTANCE: ${EVOLUTION_DEL_INSTANCE:-false}
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://${POSTGRES_USER:-uorconnect}:${POSTGRES_PASSWORD}@postgres:5432/${EVOLUTION_POSTGRES_DB:-evolution}
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-uorconnect}:${POSTGRES_PASSWORD}@postgres:5432/${EVOLUTION_POSTGRES_DB:-evolution}
      DATABASE_CONNECTION_CLIENT_NAME: evolution_v2
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/1
      CACHE_REDIS_PREFIX_KEY: evolution_v2
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      RABBITMQ_ENABLED: "false"
      LOG_LEVEL: ${EVOLUTION_LOG_LEVEL:-ERROR}
    expose:
      - "8080"
    volumes:
      - evolution_instances:/evolution/instances
    mem_limit: 768m
    cpus: 1.00
    networks:
      - internal

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_URL}
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    mem_limit: 256m
    cpus: 0.75
    networks:
      - internal

  laboratorio:
    build:
      context: ..
      dockerfile: deploy/laboratorio.Dockerfile
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_URL}
        VITE_LAB_BASE_PATH: /
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    mem_limit: 192m
    cpus: 0.5
    networks:
      - internal

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      evolution-api:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-uorconnect}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-uorconnect}?schema=public}
      NODE_OPTIONS: --max-old-space-size=512
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-400}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      PGPOOL_MAX: ${PGPOOL_MAX:-20}
      PGPOOL_MIN: ${PGPOOL_MIN:-2}
      PGPOOL_IDLE_TIMEOUT_MS: ${PGPOOL_IDLE_TIMEOUT_MS:-30000}
      PGPOOL_CONNECT_TIMEOUT_MS: ${PGPOOL_CONNECT_TIMEOUT_MS:-8000}
      EVOLUTION_API_BASE_URL: ${EVOLUTION_API_BASE_URL:-http://evolution-api:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
    expose:
      - "3333"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3333/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    mem_limit: 1024m
    cpus: 1.50
    tmpfs:
      - /tmp:size=128m
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    command: ["caddy", "run", "--config", "/opt/deploy/Caddyfile", "--adapter", "caddyfile"]
    restart: unless-stopped
    depends_on:
      - frontend
      - laboratorio
      - backend
    environment:
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:-uorconnect.space, www.uorconnect.space}
      API_DOMAIN: ${API_DOMAIN:-api.uorconnect.space}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/opt/deploy:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    cpus: 0.5
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
  caddy_data:
  caddy_config:

networks:
  internal:
