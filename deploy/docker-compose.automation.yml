services:
  automation_postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AUTOMATION_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTOMATION_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUTOMATION_POSTGRES_DB}
    volumes:
      - automation_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTOMATION_POSTGRES_USER} -d ${AUTOMATION_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - automation

  automation_redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${AUTOMATION_REDIS_PASSWORD}
      --appendonly yes
    volumes:
      - automation_redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${AUTOMATION_REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - automation

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      automation_postgres:
        condition: service_healthy
      automation_redis:
        condition: service_healthy
    environment:
      N8N_HOST: ${N8N_DOMAIN}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-https://${N8N_DOMAIN}}
      WEBHOOK_URL: ${WEBHOOK_URL:-https://${N8N_DOMAIN}}
      GENERIC_TIMEZONE: ${AUTOMATION_TIMEZONE}
      N8N_LOG_LEVEL: ${N8N_LOG_LEVEL}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-true}
      N8N_DIAGNOSTICS_ENABLED: false
      N8N_PERSONALIZATION_ENABLED: false
      N8N_BASIC_AUTH_ACTIVE: true
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: automation_postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${AUTOMATION_POSTGRES_DB}
      DB_POSTGRESDB_USER: ${AUTOMATION_POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${AUTOMATION_POSTGRES_PASSWORD}
      EXECUTIONS_MODE: regular
      EXECUTIONS_DATA_PRUNE: true
      EXECUTIONS_DATA_MAX_AGE: 336
      QUEUE_BULL_REDIS_HOST: automation_redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_PASSWORD: ${AUTOMATION_REDIS_PASSWORD}
      N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE: false
      UOR_BACKEND_API_URL: ${UOR_BACKEND_API_URL}
      UOR_BACKEND_WEBHOOK_SECRET: ${UOR_BACKEND_WEBHOOK_SECRET}
      UOR_FRONTEND_URL: ${UOR_FRONTEND_URL}
      UOR_ADMIN_WHATSAPP: ${UOR_ADMIN_WHATSAPP}
      WAHA_BASE_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_SESSION_NAME: ${WAHA_SESSION_NAME}
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"
    networks:
      - automation

  waha:
    image: devlikeapro/waha:latest
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_started
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WAHA_DASHBOARD_ENABLED: true
      WAHA_DASHBOARD_NO_PASSWORD: false
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WHATSAPP_HOOK_URL: http://n8n:5678/webhook/waha-inbound
      WHATSAPP_HOOK_EVENTS: session.status,message,message.any,message.ack
      WAHA_MEDIA_STORAGE: LOCAL
      WAHA_PRINT_QR: true
    volumes:
      - waha_sessions:/app/.sessions
      - waha_media:/app/.media
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - automation

volumes:
  automation_pgdata:
  automation_redisdata:
  n8n_data:
  waha_sessions:
  waha_media:

networks:
  automation:
